name: RydensCrowbar
version: 1.0.0
main: com.rydenvr.crowbar.CrowbarPlugin
author: RydenVR
description: An admin-only crowbar plugin for Minecraft 1.8.8

commands:
  crowbar:
    description: Gives an administrator the crowbar
    usage: /crowbar
    permission: rydenscrowbar.admin

permissions:
  rydenscrowbar.admin:
    description: Allows use of the crowbar command
    default: op
